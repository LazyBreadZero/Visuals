<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Between Summits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* A short film in code. Everything on screen is generated by a WebGL fragment shader plus DOM captions.
   Palette is the film's own, scene by scene; the page chrome stays near-black and warm white. */
:root{--bg:#050507;--paper:#f3ead9;--dim:rgba(243,234,217,.55);--accent:#ffb36b;--serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#caps{position:fixed;left:0;right:0;bottom:7%;z-index:3;text-align:center;pointer-events:none;padding:0 max(24px,env(safe-area-inset-left,0px))}
.cap{position:absolute;left:0;right:0;bottom:0;opacity:0}
.cap span{display:block;opacity:0;font:300 clamp(20px,3.1vw,44px)/1.38 var(--serif);letter-spacing:.012em;text-shadow:0 2px 24px rgba(0,0,0,.65),0 0 3px rgba(0,0,0,.5)}
.cap.big span{font-weight:300;font-size:clamp(34px,7vw,104px);letter-spacing:.22em;text-indent:.22em;text-transform:uppercase}
.cap.sub span{font:400 clamp(10px,1.2vw,14px)/1.6 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
#chap{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:7%;z-index:3;font:400 clamp(10px,1.1vw,13px)/1 var(--mono);letter-spacing:.32em;color:var(--dim);opacity:0;pointer-events:none;text-transform:uppercase}
.card{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(24px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 55%,rgba(5,5,7,.25),rgba(5,5,7,.78))}
.card h1{margin:0;font:300 clamp(40px,9vw,128px)/.95 var(--serif);letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;text-shadow:0 4px 40px rgba(0,0,0,.6)}
.card p{margin:0;max-width:34em;font:300 clamp(16px,1.9vw,24px)/1.5 var(--serif);font-style:italic;color:var(--dim)}
.card .note{font:400 11px/1.7 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(243,234,217,.38);font-style:normal}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}
button{all:unset;cursor:pointer;font:400 12px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;padding:15px 24px;border:1px solid rgba(243,234,217,.5);color:var(--paper);transition:background .4s,color .4s,border-color .4s}
button:hover,button:focus-visible{background:var(--paper);color:#0a0a0c;border-color:var(--paper)}
button.quiet{border-color:rgba(243,234,217,.22);color:var(--dim)}
[hidden]{display:none!important}
#nogl{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font:300 22px/1.5 var(--serif)}
</style>
</head>
<body>
<canvas id="c" aria-label="A short generative film in six scenes about attention, intensity, and the long middle between summits."></canvas>
<div id="chap"></div>
<div id="caps"></div>

<div class="card" id="intro">
  <h1>Between<br>Summits</h1>
  <p>A short film about attention, intensity, and the long middle in between.</p>
  <div class="btns"><button id="goSound">Begin with sound</button><button id="goSilent" class="quiet">Begin silent</button></div>
  <div class="note">2 min 28 s · headphones help · contains fast-moving light in the first scene</div>
</div>
<div class="card" id="outro" hidden style="background:transparent;justify-content:flex-end;padding-bottom:5%">
  <div class="btns"><button id="again">Watch again</button></div>
</div>
<div id="nogl" hidden>This film needs WebGL 2. Try a recent Chrome, Safari or Firefox.</div>

<script>
// ============ timeline ============
const LEN = 148;                                          // seconds
const START = [0, 20, 44, 66, 92, 114];                   // scene start times
const FADE = 3.2;                                         // crossfade half-width
const CHAPTERS = ['I · Noise', 'II · Stillness', 'III · Summit', 'IV · The middle', 'V · Roots', 'VI · Why it matters'];
const CAPS = [
  [2.2, 7.4,  'Everything wants a piece of you.'],
  [8.6, 13.8, 'A thousand small hands|pulling at once.'],
  [15.2, 19.8, 'I came looking for the quiet underneath.'],
  [23, 29.2,  'I say I want calm.'],
  [31, 38,    'Then I go looking|for the edge of a cliff.'],
  [39.6, 43.6, 'Both of them are me.'],
  [47, 53.5,  'And then, a summit.|A wave that lifts. A pitch that lands.'],
  [55, 63.5,  'For a moment, everything is clear.|I know exactly why I am here.'],
  [69, 75,    'But no one films the middle.'],
  [77, 85.5,  'The long, grey, unglamorous middle.|Where nothing is happening,|and everything is decided.'],
  [86.8, 91.2, 'I begin well. I am learning to stay.'],
  [95, 100.8, 'I have lived in many places.'],
  [102.2, 108.6, 'Roots, it turns out,|are something you give.'],
  [109.8, 113.6, 'Home is a person.'],
  [117, 123.2, 'Meaning is not the summit.'],
  [125, 132.4, 'It is whether you can love|the walk between.'],
  [134, 140, 'To make the world feel|why it matters.'],
  [141.6, 147, 'Between Summits', 'big'],
];

// ============ shaders ============
const VS = `#version 300 es
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2)); gl_Position=vec4(p*2.-1.,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uW[6]; uniform float uS[6]; uniform float uFade; uniform float uAsp;
out vec4 outc;

float sm(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.,1.); return t*t*(3.-2.*t); }
float h11(float n){ return fract(sin(n*127.1+11.7)*43758.5453); }
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s; }

// ---------- I. NOISE : a feed of light, then it slows to nothing ----------
vec3 sFeed(vec2 p,float t){
  t=max(t,0.);
  float k=.17, env=exp(-k*t);
  float travel=5.0/k*(1.-env)+.05*t;
  float laneW=.2, id=floor(p.x/laneW), lx=(fract(p.x/laneW)-.5)*laneW;
  float sp=(.5+h11(id+3.)*.9)*(h11(id)>.5?1.:-1.);
  float ch=.20+.12*h11(id+7.);
  float blur=.30*env*sp;
  vec3 acc=vec3(0.);
  for(int i=0;i<6;i++){
    float o=(float(i)/5.-.5)*blur;
    float y=p.y+sp*travel+o+h11(id+9.)*3.;
    float ci=floor(y/ch), fy=(fract(y/ch)-.5)*ch, r=h21(vec2(id,ci));
    if(r>.22){
      float hw=laneW*.40, hh=ch*(.30+.12*r);
      vec2 q=abs(vec2(lx,fy))-vec2(hw,hh)+.012;
      float d=length(max(q,0.))+min(max(q.x,q.y),0.)-.012;
      vec3 pal=mix(vec3(.15,.85,1.),vec3(1.,.25,.75),fract(r*5.3));
      float u=(fy+hh)/(2.*hh), media=step(.45,u);
      float row=floor(fy/.016), lines=step(.5,fract(fy/.016))*step(lx+hw,hw*2.*(.35+.65*h11(row+r*50.)));
      vec3 inside=media*pal*(.45+.5*u)+(1.-media)*(lines*vec3(.6,.72,.85)*.5+(1.-lines)*pal*.05);
      acc+=inside*sm(.003,-.003,d)+exp(-max(d,0.)*55.)*pal*.16;
    }
  }
  acc/=6.;
  vec3 col=mix(vec3(.006,.01,.03),vec3(.02,.03,.08),p.y+.5);
  col+=acc*(.30+.7*env)*(1.-sm(15.,21.,t))*1.45;
  float hl=exp(-abs(p.y)*90.)*sm(10.,19.,t)*(1.-sm(19.,27.,t));
  return col+vec3(.55,.75,1.)*hl*.8;
}

// ---------- II. STILLNESS : blue hour, a moon, a lake that is about to be stirred ----------
float ridge(float x,float seed,float f){ return fbm(vec2(x*f+seed,seed*1.7)); }
vec3 lakeAbove(vec2 p,float t){
  float y=p.y;
  vec3 top=vec3(.025,.04,.13),mid=vec3(.10,.17,.36),hor=vec3(.88,.52,.46);
  vec3 col=mix(mid,top,sm(0.,.5,y));
  col=mix(hor*.8,col,sm(-.01,.2,y));
  vec2 g=p*90., id=floor(g), lc=fract(g)-.5;
  col+=step(.986,h21(id))*sm(.22,.05,length(lc))*(.6+.4*sin(t*1.3+h21(id+3.)*40.))*sm(.1,.45,y)*sm(2.,14.,t)*vec3(.8,.85,1.);
  vec2 m=vec2(.30,.24); float md=length(p-m);
  col+=vec3(1.,.95,.85)*sm(.034,.030,md)*.95+vec3(.6,.7,1.)*exp(-md*9.)*.22;
  float r0=.085+(ridge(p.x,2.,2.4)-.45)*.22;
  col=mix(col,mix(vec3(.30,.36,.52),hor*.5,.35),sm(.004,-.004,y-r0));
  float r1=.045+(ridge(p.x+3.,6.,3.4)-.45)*.20;
  col=mix(col,vec3(.12,.16,.28),sm(.004,-.004,y-r1));
  float mist=fbm(vec2(p.x*2.2+t*.02,y*9.))*exp(-abs(y-.03)*10.);
  col+=vec3(.45,.5,.7)*mist*.28;
  float r2=.005+(ridge(p.x-5.,9.,5.)-.45)*.12;
  col=mix(col,vec3(.035,.05,.10),sm(.004,-.004,y-r2));
  return col;
}
vec3 sLake(vec2 p,float t){
  if(p.y>=0.) return lakeAbove(p,t);
  float d=-p.y;
  float wob=(fbm(vec2(p.x*7.,d*50.-t*.25))-.5)*.014*(.3+d*3.);
  vec3 refl=lakeAbove(vec2(p.x+wob,d*.9),t);
  refl=mix(refl*vec3(.55,.7,.9),vec3(.02,.05,.11),.25+d*.9);
  float gl=exp(-abs(p.x-.30)*(14.+d*20.))*sm(.5,.85,vn(vec2(p.x*40.,d*140.-t*.7)))*exp(-d*2.);
  refl+=vec3(1.,.93,.8)*gl*.9;
  float rt=mod(max(t-6.,0.),12.);
  vec2 q=(p-vec2(-.10,-.20))*vec2(1.,2.8); float dd=length(q);
  float ring=exp(-pow((dd-rt*.10)*38.,2.))*exp(-rt*.28)+.6*exp(-pow((dd-(rt-.8)*.10)*38.,2.))*exp(-rt*.28);
  refl+=vec3(.5,.62,.85)*ring*step(6.,t)*.55;
  return refl;
}

float peakL(float x,float hz){
  float a=hz+.21-pow(abs(x+.36),.8)*1.35, b=hz+.09-pow(abs(x+.74),.85)*1.1;
  return max(a,b)+(fbm(vec2(x*5.+1.,2.))-.5)*.30+(fbm(vec2(x*14.,5.))-.5)*.07;
}
float peakR(float x,float hz){
  return hz+.10-pow(abs(x-.70),.85)*.95+(fbm(vec2(x*5.,4.))-.5)*.22+(fbm(vec2(x*15.,7.))-.5)*.05;
}
// ---------- III. SUMMIT : a sea of cloud, a rising sun, a peak ----------
vec3 sSummit(vec2 p,float t){
  float hz=.06-t*.0018;
  vec2 s=vec2(.17,hz-.02+t*.0030);
  float dy=p.y-hz;
  vec3 hor=vec3(1.,.64,.40),top=vec3(.10,.20,.52);
  vec3 sky=mix(hor,top,sm(0.,.62,dy));
  vec2 v=p-s; float d=length(v), ang=atan(v.y,v.x);
  sky+=vec3(1.,.72,.42)*exp(-d*3.2)*.55+vec3(1.,.85,.6)*exp(-d*14.)*.5;
  sky+=vec3(1.,.8,.55)*pow(vn(vec2(ang*7.,t*.05)),2.)*exp(-d*2.2)*.34;
  sky+=vec3(1.,.97,.9)*sm(.04,.034,d)*1.2;
  if(dy<0.){
    float z=1./(-dy+.035);
    vec2 xz=vec2(p.x*z*.9,z*1.1+t*.07);
    float a=sm(.38,.78,fbm(xz)), b=sm(.38,.78,fbm(xz+vec2(.12,-.25)));
    float lit=clamp((a-b)*3.+.55,0.,1.);
    vec3 c=mix(vec3(.07,.11,.24),mix(vec3(.30,.33,.58),vec3(1.,.78,.55),lit),a);
    c=mix(c,hor*.95,exp(dy*7.)*.85);
    c+=vec3(1.,.7,.4)*exp(-length(vec2(p.x-s.x,dy*2.4))*5.)*.25;
    sky=c;
  }
  float x=p.x;
  float rR=peakR(x,hz);
  float farM=sm(-.002,.002,rR-p.y);
  sky=mix(sky,mix(mix(vec3(.38,.32,.55),hor,.25),hor*.9,sm(hz+.12,hz-.1,p.y)*.6),farM*.82);
  float rL=peakL(x,hz);
  float inside=sm(-.0025,.0025,rL-p.y);
  float slope=(peakL(x+.012,hz)-peakL(x-.012,hz))/.024;
  float lit=.12+.88*sm(-.5,1.1,-slope);
  float strata=fbm(vec2(x*22.+p.y*3.,p.y*7.));
  float depth=rL-p.y;
  vec3 rock=vec3(.03,.035,.07)*(.6+.9*strata)+vec3(1.,.62,.32)*lit*(.12+.6*strata)*sm(.55,0.,depth)*1.2;
  rock+=vec3(1.,.7,.4)*sm(.02,0.,depth)*lit*.8;
  float snow=sm(.11,.04,depth+(fbm(vec2(x*30.,p.y*30.))-.5)*.08)*sm(hz-.03,hz+.07,p.y);
  rock=mix(rock,mix(vec3(.5,.5,.72),vec3(1.,.84,.64),lit),snow*.9);
  sky=mix(sky,rock,inside);
  return sky*(.55+.45*sm(0.,12.,t+3.));
}

// ---------- IV / VI. THE MIDDLE : the same road, grey and then lit ----------
vec3 sMiddle(vec2 p,float t,float warm,float lamps){
  float hz=.03, ph=6.2832*1.1*t;
  p.y+=sin(ph)*.0030; p.x+=sin(ph*.5)*.0045;
  vec3 skyTop=mix(vec3(.50,.54,.60),vec3(.17,.25,.50),warm);
  vec3 skyHor=mix(vec3(.76,.78,.80),vec3(1.,.66,.40),warm);
  float dy=p.y-hz;
  vec3 col=mix(skyHor,skyTop,sm(0.,.6,dy));
  float cl=fbm(vec2(p.x*1.3+t*.012,p.y*3.5));
  col=mix(col,col*mix(.82,.9,warm)+vec3(.04),sm(.4,.8,cl)*sm(0.,.3,dy)*.6);
  vec2 sp=vec2(.05,hz+.015+warm*.02); float sd=length(p-sp);
  col+=vec3(1.,.7,.4)*(exp(-sd*5.)*.5+exp(-sd*18.)*.5)*warm;
  float trav=t*.85; const float SP=2.4; const float camH=.5; const float F=.6;
  if(dy<0.){
    float z=camH*F/(-dy), wx=p.x*z/F, wz=z+trav;
    float tex=fbm(vec2(wx*1.6,wz*1.6))*.5+fbm(vec2(wx*7.,wz*7.))*.5;
    vec3 g=mix(vec3(.33,.34,.32),vec3(.46,.40,.31),tex);
    g=mix(g,g*1.18+.03,sm(1.25,.6,abs(wx))*.7);
    g*=mix(vec3(1.),vec3(1.15,.82,.58),warm);
    float dz=abs(fract(wz/SP+.5)-.5)*SP, dx=min(abs(wx-1.3),abs(wx+1.3));
    g+=vec3(1.,.62,.28)*exp(-(dx*dx*1.2+dz*dz*1.6))*lamps*.55;
    col=mix(g,mix(skyHor,vec3(1.,.72,.45),warm*.5),clamp(1.-exp(-z*.075),0.,1.));
  }
  for(int k=0;k<20;k++){
    float zk=(float(k)+1.-fract(trav/SP))*SP;
    if(zk<.7) continue;
    float fz=exp(-zk*.06);
    for(int s=0;s<2;s++){
      float sg=s==0?-1.:1.;
      float sx=sg*1.3/zk*F, yb=-camH/zk*F+hz, yt=(.95-camH)/zk*F+hz, w=.045/zk*F;
      float m=sm(w+.0015,w-.0015,abs(p.x-sx))*sm(yb-.002,yb+.002,p.y)*sm(yt+.002,yt-.002,p.y);
      float u=(p.x-sx)/w, vv=clamp((p.y-yb)/(yt-yb),0.,1.);
      vec3 pc=mix(vec3(.18,.17,.16),vec3(.28,.20,.14),warm)*(.72+.38*vv);
      pc+=vec3(.95,.52,.22)*warm*sm(-.3,.9,-sg*u)*.55*(.4+.6*lamps)+vec3(.3)*sm(.97,1.,vv)*.25;
      col=mix(col,mix(pc,col,1.-fz),m);
      float ld=length(p-vec2(sx,yt+.004/zk*F));
      float lamp=lamps*(.85+.15*sin(t*2.7+float(k)*1.9+sg));
      col+=vec3(1.,.66,.30)*lamp*(exp(-ld*zk*11.)*.9+exp(-ld*zk*38.)*1.2)*exp(-zk*.035)+vec3(1.,.9,.7)*lamp*sm(.06,0.,ld*zk)*.9*exp(-zk*.03);
    }
  }
  return col;
}

// ---------- V. ROOTS : many small lights, drawn toward one ----------
vec3 sRoots(vec2 p,float t){
  vec3 col=mix(vec3(.015,.02,.055),vec3(.01,.012,.04),sm(-.5,.5,p.y));
  col+=vec3(.05,.04,.10)*fbm(p*1.6+vec2(t*.01,0.))*.8*sm(.5,-.1,p.y);
  vec2 g=p*80., id=floor(g), lc=fract(g)-.5;
  col+=step(.985,h21(id))*sm(.22,.05,length(lc))*(.5+.5*sin(t*1.1+h21(id)*30.))*sm(-.05,.3,p.y)*vec3(.8,.85,1.)*.7;
  float r1=-.05+(fbm(vec2(p.x*2.+4.,3.))-.45)*.22, r2=-.16+(fbm(vec2(p.x*3.5+9.,8.))-.45)*.16;
  col=mix(col,vec3(.03,.035,.07),sm(.003,-.003,p.y-r1));
  col=mix(col,vec3(.015,.018,.04),sm(.003,-.003,p.y-r2));
  vec2 wg=p*vec2(70.,70.), wid=floor(wg), wl=fract(wg)-.5;
  float vill=sm(r2,r2-.07,p.y)*sm(.25,.65,fbm(vec2(p.x*3.,5.)))*sm(-.5,-.2,p.y);
  col+=vec3(1.,.7,.35)*step(.78,h21(wid))*sm(.3,.12,abs(wl.x))*sm(.24,.1,abs(wl.y))*vill*(.6+.4*sin(t*.8+h21(wid)*20.))*.9;
  vec2 C=vec2(0.,.10); float rev=sm(1.,17.,t);
  for(int i=0;i<9;i++){
    float fi=float(i);
    vec2 a=vec2(-.72+fi*.18+(h11(fi)-.5)*.08,-.17+(h11(fi+4.)-.5)*.05);
    vec2 m=mix(a,C,.5)+vec2((fi-4.)*.05+(h11(fi+2.)-.5)*.08,.07+.17*h11(fi+9.));
    float best=1e3,bu=0.; vec2 prev=a;
    for(int s=1;s<=8;s++){
      float u=float(s)/8.; vec2 q=(1.-u)*(1.-u)*a+2.*(1.-u)*u*m+u*u*C, e=q-prev;
      float l=clamp(dot(p-prev,e)/dot(e,e),0.,1.), dd=length(p-prev-e*l);
      if(dd<best){ best=dd; bu=(float(s)-1.+l)/8.; }
      prev=q;
    }
    float vis=sm(clamp(rev*1.35-fi*.045,0.,1.)+.012,clamp(rev*1.35-fi*.045,0.,1.)-.02,bu);
    float pl=.62+.38*sin(bu*18.-t*1.4+fi);
    col+=vec3(1.,.72,.38)*(exp(-best*best*20000.)*.9+exp(-best*40.)*.09)*pl*vis;
  }
  float cd=length(p-C);
  col+=vec3(1.,.75,.42)*(exp(-cd*9.)*.5+exp(-cd*30.)*.8)*(1.+.1*sin(t*1.2))*sm(0.,10.,t);
  col+=vec3(1.,.95,.85)*sm(.022,.016,cd)*sm(4.,10.,t);
  for(int L=0;L<3;L++){
    float fl=float(L); vec2 g2=p*(10.+fl*7.)+vec2(fl*3.3,-t*(.25+.15*fl)), id2=floor(g2);
    vec2 lc2=fract(g2)-.5+(vec2(h21(id2+1.3),h21(id2+2.7))-.5)*.6; float r=h21(id2+fl*7.);
    col+=vec3(1.,.6,.3)*step(.9,r)*sm(.12,0.,length(lc2))*.35*(.5+.5*sin(t*2.+r*60.));
  }
  return col;
}

void main(){
  vec2 fc=gl_FragCoord.xy, p=(fc-.5*uRes)/uRes.y;
  vec3 c=vec3(0.);
  if(uW[0]>.001) c+=uW[0]*sFeed(p,uS[0]);
  if(uW[1]>.001) c+=uW[1]*sLake(p,uS[1]);
  if(uW[2]>.001) c+=uW[2]*sSummit(p,uS[2]);
  if(uW[3]>.001) c+=uW[3]*sMiddle(p,uS[3],.25*sm(10.,26.,uS[3]),0.);
  if(uW[4]>.001) c+=uW[4]*sRoots(p,uS[4]);
  if(uW[5]>.001) c+=uW[5]*sMiddle(p,uS[5],.3+.7*sm(0.,22.,uS[5]),sm(2.,16.,uS[5]));
  c=1.-exp(-c*1.55); c=mix(c,c*c*(3.-2.*c),.30);                        // soft highlight shoulder + gentle contrast
  c*=1.-.5*pow(length(p*vec2(.85,1.05)),2.3);                         // vignette
  float lum=dot(c,vec3(.3,.59,.11)); c=mix(vec3(lum),c,1.06);
  c+=(h21(fc+fract(uT*7.13)*311.)-.5)*.045;                           // film grain
  c*=uFade;
  float hb=min(.5,uAsp/4.4);                                       // 2.2:1 letterbox on wide screens
  if(uAsp>1.5 && abs(p.y)>hb) c=vec3(0.);
  outc=vec4(max(c,0.),1.);
}`;

// ============ GL setup ============
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('nogl').hidden = false; throw new Error('no webgl2'); }
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); } return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n), uRes = U('uRes'), uT = U('uT'), uW = U('uW[0]'), uS = U('uS[0]'), uFade = U('uFade'), uAsp = U('uAsp');
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const Q = +(new URLSearchParams(location.search).get('q') || 1);
let scale = Q, dpr = 1, W = 1, H = 1;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(2, Math.floor(innerWidth * dpr * scale)); H = Math.max(2, Math.floor(innerHeight * dpr * scale));
  cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
  const asp = innerWidth / innerHeight, bar = asp > 1.5 ? Math.max(0, (innerHeight - innerWidth / 2.2) / 2) : 0;
  document.getElementById('caps').style.bottom = (bar + innerHeight * .06) + 'px';
  document.getElementById('chap').style.top = (bar + innerHeight * .05) + 'px';
}
addEventListener('resize', resize);

// ============ captions + chapter tags ============
const capsEl = document.getElementById('caps'), chapEl = document.getElementById('chap');
const capNodes = CAPS.map(([t0, t1, txt, cls]) => {
  const d = document.createElement('div'); d.className = 'cap ' + (cls || '');
  const lines = txt.split('|').map(l => { const s = document.createElement('span'); s.textContent = l; d.appendChild(s); return s; });
  capsEl.appendChild(d); return { t0, t1, d, lines };
});
function updateText(T){
  for (const c of capNodes){
    const out = 1 - sm(c.t1 - 1.8, c.t1, T), on = T > c.t0 - .1 && T < c.t1 + .1;
    c.d.style.opacity = on ? 1 : 0;
    c.lines.forEach((s, j) => { const a = sm(c.t0 + j * .9, c.t0 + j * .9 + 2, T) * out; s.style.opacity = a; s.style.transform = `translateY(${(1 - a) * 10}px)`; s.style.filter = `blur(${(1 - a) * 6}px)`; });
  }
  let a = 0, label = '';
  START.forEach((s, i) => { const v = sm(s + 1, s + 2.6, T) * (1 - sm(s + 5.2, s + 7, T)); if (v > a){ a = v; label = CHAPTERS[i]; } });
  chapEl.textContent = label; chapEl.style.opacity = a;
}

// ============ audio: a generative score, scheduled up-front on the audio clock ============
let ac = null, A0 = 0, master = null;
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildAudio(){
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const rnd = mulberry(11), out = ac.createGain(), comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = 0;
  const dry = ac.createGain(), wet = ac.createGain(), verb = ac.createConvolver();
  dry.gain.value = .72; wet.gain.value = .6;
  const len = Math.floor(ac.sampleRate * 3.6), imp = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++){ const d = imp.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
  verb.buffer = imp;
  master.connect(dry); master.connect(verb); verb.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(out); out.connect(ac.destination);
  out.gain.value = .9;
  A0 = ac.currentTime + 1.0;
  const T = t => A0 + t;
  const pad = (f, t0, t1, vol, c0, c1) => {
    const g = ac.createGain(), fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = .4;
    fl.frequency.setValueAtTime(c0, T(t0)); fl.frequency.linearRampToValueAtTime(c1, T(t1));
    g.gain.setValueAtTime(0, T(t0)); g.gain.linearRampToValueAtTime(vol, T(t0 + 4.5)); g.gain.setValueAtTime(vol, T(t1 - 4.5)); g.gain.linearRampToValueAtTime(0, T(t1));
    fl.connect(g); g.connect(master);
    for (const dt of [-7, 7]){ const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt; o.connect(fl); o.start(T(t0)); o.stop(T(t1) + .2); }
  };
  const bell = (f, t, vol, dur = 4.5) => {
    const g = ac.createGain(); g.gain.setValueAtTime(0, T(t)); g.gain.linearRampToValueAtTime(vol, T(t) + .015); g.gain.exponentialRampToValueAtTime(.0001, T(t) + dur); g.connect(master);
    [[1, 1], [2.01, .35], [3.98, .12]].forEach(([m, a]) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m; const gg = ac.createGain(); gg.gain.value = a; o.connect(gg); gg.connect(g); o.start(T(t)); o.stop(T(t) + dur + .1); });
  };
  const thump = (t, vol) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(95, T(t)); o.frequency.exponentialRampToValueAtTime(42, T(t) + .16); g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.0001, T(t) + .32); o.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t) + .4); };
  const tick = (t, vol, f) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(vol, T(t)); g.gain.exponentialRampToValueAtTime(.0001, T(t) + .05); o.connect(g); g.connect(master); o.start(T(t)); o.stop(T(t) + .08); };
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
  const swell = (t0, t1, vol, f0, f1) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.Q.value = 1.2; b.frequency.setValueAtTime(f0, T(t0)); b.frequency.exponentialRampToValueAtTime(f1, T(t1)); const g = ac.createGain(); g.gain.setValueAtTime(0, T(t0)); g.gain.linearRampToValueAtTime(vol, T(t0 + 3)); g.gain.linearRampToValueAtTime(0, T(t1)); s.connect(b); b.connect(g); g.connect(master); s.start(T(t0)); s.stop(T(t1) + .1); };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  // I  noise: tense cluster, a flurry of ticks that slows to silence
  [77.8, 87.3, 110, 185].forEach(f => pad(f, 0, 25, .028, 500, 380)); swell(0, 20, .045, 5200, 400);
  for (let t = .6; t < 19; ){ tick(t, .018 * (1 - t / 22), 1800 + rnd() * 1800); t += .08 + Math.pow(t / 19, 2.2) * 1.5; }
  // II stillness: open fifths, a few bells
  [73.4, 110, 146.8, 329.6].forEach(f => pad(f, 19, 47, .045, 700, 1100));
  for (let t = 24; t < 43; t += 3.2 + rnd() * 2.6) bell(pick([587.3, 659.3, 740, 880]), t, .05);
  // III summit: the chord lifts and opens
  [98, 146.8, 246.9, 370].forEach(f => pad(f, 43, 69, .05, 1200, 3000));
  [392, 493.9, 587.3, 740, 784, 987.8].forEach((f, i) => { bell(f, 49 + i * 1.5, .06); bell(f * 2, 58 + i * 1.1, .03); });
  // IV the middle: a low drone and footsteps
  [55, 82.4, 110].forEach(f => pad(f, 65, 95, .05, 320, 360));
  for (let t = 67.2; t < 92; t += 1 / 1.1) thump(t, .2);
  // V roots: warm and tender
  [87.3, 130.8, 220, 329.6].forEach(f => pad(f, 91, 117, .048, 1400, 1800));
  for (let t = 95; t < 113; t += 2.1 + rnd() * 1.9) bell(pick([698.5, 784, 880, 1046.5, 1174.7]), t, .055);
  // VI why it matters: resolution
  [73.4, 110, 146.8, 185, 220, 329.6].forEach(f => pad(f, 113, 148, .04, 1000, 3200));
  [587.3, 740, 880, 1174.7].forEach((f, i) => { for (let t = 117 + i * .7; t < 134; t += 2.8 - i * .2) bell(f, t, .045); });
  bell(587.3, 141.6, .08, 7); bell(293.7, 141.6, .08, 7);
  master.gain.setValueAtTime(0, A0 - .5); master.gain.linearRampToValueAtTime(.8, A0 + 3); master.gain.setValueAtTime(.8, A0 + LEN - 6); master.gain.linearRampToValueAtTime(0, A0 + LEN);
}

// ============ playback ============
const intro = document.getElementById('intro'), outro = document.getElementById('outro');
let state = 'title', T = -1, tStart = 0, frozen = false, idle = 0, last = performance.now(), fr = 0, acc = 0;
const wv = new Float32Array(6), sv = new Float32Array(6);
function weights(T){
  const b = START.slice(1).map(s => sm(s - FADE, s + FADE, T));
  wv[0] = 1 - b[0]; for (let i = 1; i < 5; i++) wv[i] = b[i - 1] * (1 - b[i]); wv[5] = b[4];
  for (let i = 0; i < 6; i++) sv[i] = T - START[i];
}
function render(){
  if (state === 'title'){ wv.fill(0); wv[1] = 1; sv.fill(0); sv[1] = 6 + idle; }
  else weights(T);
  const fade = state === 'title' ? 1 : sm(0, 2.6, T) * (1 - sm(LEN - 2.2, LEN, T));
  gl.uniform2f(uRes, W, H); gl.uniform1f(uT, state === 'title' ? idle : T); gl.uniform1fv(uW, wv); gl.uniform1fv(uS, sv);
  gl.uniform1f(uFade, fade); gl.uniform1f(uAsp, innerWidth / innerHeight);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  updateText(state === 'title' ? -99 : T);
}
function frame(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!frozen){
    if (state === 'title') idle += dt * .6;
    else if (state === 'play'){
      T = ac ? ac.currentTime - A0 : (now - tStart) / 1000 - 1;
      if (T >= LEN){ state = 'end'; outro.hidden = false; if (ac){ ac.close(); ac = null; } }
    }
    acc += dt; fr++;
    if (fr === 45){                                               // adaptive resolution
      const ms = acc / 45 * 1000; acc = 0; fr = 0;
      if (ms > 28 && scale > .4){ scale = Math.max(.4, scale * .82); resize(); } else if (ms < 13 && scale < Q){ scale = Math.min(Q, scale * 1.08); resize(); }
    }
  }
  render(); requestAnimationFrame(frame);
}
function begin(withSound){
  intro.hidden = true; outro.hidden = true; state = 'play'; T = -1; tStart = performance.now();
  if (withSound){ try { buildAudio(); } catch (e) { ac = null; } }
}
document.getElementById('goSound').onclick = () => begin(true);
document.getElementById('goSilent').onclick = () => begin(false);
document.getElementById('again').onclick = () => { outro.hidden = true; begin(true); };
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && state === 'title') begin(true); });

// test / sharing hook: ?t=60 jumps straight to a moment (silent). window.film.seek(t) renders one exact frame.
window.film = { seek(t){ frozen = true; state = 'play'; intro.hidden = true; T = t; render(); } };
resize();
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null){ state = 'play'; intro.hidden = true; tStart = performance.now() - (+qt + 1) * 1000; T = +qt; }
requestAnimationFrame(frame);
</script>
</body>
</html>
