<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concrete Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Single full-bleed canvas. Palette lives in the script (CONCRETE, INK, BONE, SEA, MOSS, SIGNAL). */
:root{--ink:#11130f;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A 10 second animation: a rigid concrete and terminal grid melts into ocean waves, a diver backflips off a cliff, a foil rider crosses the swell, and the two worlds merge."></canvas>
<script>
const DUR = 10;                                   // seconds, exactly
const CONCRETE = '#c9c6bc', INK = '#11130f', BONE = '#ece8dc', MOSS = '#6f8a4e', SIGNAL = '#ff4a1c', SEA1 = '#0f5a5e', SEA2 = '#041417';
const CH = ['0','1','/','\\','+','=','{','}','<','>','_','#',';'];
const LINES = [[.4,'$ ssh workspace@prod'],[1.1,'> 4 agents online ........ ok'],[2,'> saas build --target=ship'],[3,'$ jump --cliff --backflip'],
               [5.6,'splash. 0 conflicts'],[6.9,'$ pump --foil --prone'],[8.3,'$ git merge ocean'],[9,'Merge made. rigid + fluid.']];
const T_JUMP = 3.2, T_SPLASH = 5.7;

const cv = document.getElementById('c'), g = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const hash = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v); };

let W, H, dpr, s, C, R, sprites = {}, speck = [];
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
  s = Math.max(W / 40, 19 * dpr); C = Math.ceil(W / s); R = Math.ceil(H / s) + 1;
  sprites = {}; speck = Array.from({ length: 320 }, (_, k) => [hash(k, 1) * W, hash(k, 2) * H, (hash(k, 3) * 1.6 + .4) * dpr]);
  draw(clock);
}
const font = (px, w = 400) => `${w} ${px}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
function spr(ch, col){                             // cached glyph sprites keep ~700 glyphs/frame cheap
  const k = ch + col; if (sprites[k]) return sprites[k];
  const c = document.createElement('canvas'); c.width = c.height = Math.ceil(s);
  const x = c.getContext('2d'); x.font = font(s * .8, 700); x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(ch, s / 2, s / 2 + s * .04); return sprites[k] = c;
}

// ---------- the world at time tt ----------
const fluid = tt => sm(2.4, 9, tt);
const horizon = tt => H * (.62 - .09 * sm(6.2, 9.4, tt));
const xe = () => W * .55;                           // splash point
const wave = (x, tt) => Math.sin(x / (s * 6.5) + tt * 1.25) + .45 * Math.sin(x / (s * 2.9) - tt * 2.2 + 1.7);
function ripple(x, tt){
  const u = tt - T_SPLASH; if (u < 0) return 0;
  const d = Math.abs(x - xe());
  return s * 1.1 * Math.exp(-d / (s * 7)) * Math.exp(-u * .45) * Math.sin(d / (s * .9) - u * 7) * sm(0, .15, u);
}
const surf = (x, tt) => horizon(tt) + s * 1.5 * fluid(tt) * wave(x, tt) + ripple(x, tt);
function disp(x, y, tt){                            // how far a grid row is pushed at (x,y)
  const F = fluid(tt), y0 = horizon(tt), amp = s * 1.5 * F;
  const w = y >= y0 ? 1 - .5 * clamp((y - y0) / (H - y0)) : F * F * F * .45;
  return (amp * wave(x - (y - y0) * .35, tt) + ripple(x, tt)) * w;
}
function cliff(){ const t = [[0, .14, 4], [.14, .2, 7], [.2, .25, 10], [.25, .29, 13]]; return t.map(([a, b, r]) => [a * W, r * s, (b - a) * W]); } // x, top, width
function term(){ const tw = clamp(W * .34, 290 * dpr, 460 * dpr), fs = tw / 27; return { x: W - tw - Math.max(14 * dpr, W * .03), y: W < 700 * dpr ? 46 * dpr : Math.max(14 * dpr, H * .035), w: tw, h: 15 * fs, fs }; }

// ---------- one frame ----------
let clock = 0;
function sq(x, y, a, size){ g.save(); g.translate(x, y); g.rotate(a); g.rect(-size / 2, -size / 2, size, size); g.restore(); }
function diverAt(tt){
  const u = (tt - T_JUMP) / (T_SPLASH - T_JUMP), x0 = W * .125, y0 = 4 * s - s * .3, x1 = xe(), y1 = surf(x1, T_SPLASH);
  return { x: lerp(x0, x1, u), y: lerp(y0, y1, u) - 4 * s * 5 * u * (1 - u), a: -u * Math.PI * 3 };
}
function draw(t){
  const F = fluid(t), y0 = horizon(t), size = s * .62, step = s / 2;
  // 1. concrete + sea, split by the wave line
  g.fillStyle = CONCRETE; g.fillRect(0, 0, W, H);
  const pts = []; for (let x = 0; x <= W + step; x += step) pts.push([x, surf(x, t)]);
  const above = new Path2D(), below = new Path2D();
  above.moveTo(0, 0); above.lineTo(W, 0); below.moveTo(0, H); below.lineTo(W, H);
  for (let k = pts.length - 1; k >= 0; k--) above.lineTo(pts[k][0], pts[k][1]);
  for (let k = pts.length - 1; k >= 0; k--) below.lineTo(pts[k][0], pts[k][1]);
  const sea = g.createLinearGradient(0, y0 - s * 2, 0, H); sea.addColorStop(0, SEA1); sea.addColorStop(1, SEA2);
  g.fillStyle = sea; g.fill(below);

  // 2. grid (rows bend, columns stay rigid), stroked once in ink above the wave and once in bone below it
  const grid = new Path2D();
  for (let i = 0; i <= C; i++){ grid.moveTo(i * s, 0); grid.lineTo(i * s, H); }
  for (let j = 0; j <= R; j++){
    const y = j * s; grid.moveTo(0, y + disp(0, y, t));
    for (let x = step; x <= W + step; x += step) grid.lineTo(x, y + disp(x, y, t));
  }
  g.lineWidth = dpr;
  g.save(); g.clip(above);
  g.fillStyle = INK; for (const [x, y, r] of speck){ g.globalAlpha = .1; g.fillRect(x, y, r, r); }   // concrete grain
  g.globalAlpha = .3; g.strokeStyle = INK; g.stroke(grid); g.restore();
  g.save(); g.clip(below); g.globalAlpha = .26; g.strokeStyle = BONE; g.stroke(grid); g.restore();
  g.globalAlpha = 1;

  // 3. glyph cells: code above the water, foam and sinking binary below it
  const cl = cliff(), T = term(), sa = Array.from({ length: C }, (_, i) => surf((i + .5) * s, t));
  const flow = Math.floor(F * t * 2.2), scan = (t * 9) % (R + 6) - 3;
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++){
    const cx = (i + .5) * s, cy0 = (j + .5) * s, cy = cy0 + disp(cx, cy0, t);
    if (cx > T.x - s && cx < T.x + T.w + s && cy > T.y - s && cy < T.y + T.h + s) continue;
    if (cl.some(([x, top, w]) => cx < x + w && cy > top - s * .5)) continue;
    const isBelow = cy > sa[i], h = hash(i - (isBelow ? flow : 0), j);
    let ch, col, al;
    if (!isBelow){
      if (h < .58) continue;
      ch = CH[Math.floor(h * 97) % CH.length]; al = .5; col = INK;
      if (Math.abs(j - scan) < 1.2){ col = MOSS; al = 1; }
      if (Math.floor(t * 3 + h * 20) % 9 === 0) al *= .35;
    } else {
      const d = (cy - sa[i]) / s; col = BONE;
      if (d < 1.1){ ch = h > .5 ? '≈' : '~'; al = .95; }
      else { if (h < .45) continue; ch = h > .8 ? '1' : h > .65 ? '0' : '·'; al = clamp(.6 - d * .05, .15, .6); }
    }
    g.globalAlpha = al; g.drawImage(spr(ch, col), cx - s / 2, cy - s / 2);
  }
  g.globalAlpha = 1;

  // 4. waterline: a double rule
  g.beginPath(); pts.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y));
  g.lineWidth = 3.2 * dpr; g.strokeStyle = INK; g.stroke(); g.lineWidth = 1.1 * dpr; g.strokeStyle = BONE; g.stroke();

  // 5. cliff: poured concrete with formwork lines and tie holes
  for (const [x, top, w] of cl){
    g.fillStyle = INK; g.fillRect(x, top, w + 1, H - top);
    g.strokeStyle = BONE; g.globalAlpha = .13; g.lineWidth = dpr; g.beginPath();
    for (let y = top + s; y < H; y += s){ g.moveTo(x, y); g.lineTo(x + w, y); }
    g.stroke(); g.globalAlpha = .3; g.fillStyle = BONE;
    for (let yy = top + s * .5; yy < H; yy += s * 2) for (let xx = x + s * .5; xx < x + w - 2; xx += s * 2) g.fillRect(xx - dpr, yy - dpr, 2 * dpr, 2 * dpr);
    g.globalAlpha = 1;
  }

  // 6. terminal window with typed lines
  g.fillStyle = INK; g.fillRect(T.x, T.y, T.w, T.h); g.strokeStyle = BONE; g.lineWidth = dpr; g.strokeRect(T.x + .5, T.y + .5, T.w, T.h);
  g.fillStyle = BONE; for (let k = 0; k < 3; k++) g.fillRect(T.x + T.fs * (.7 + k * .9), T.y + T.fs * .65, T.fs * .5, T.fs * .5);
  g.textBaseline = 'top'; g.font = font(T.fs * .8); g.globalAlpha = .55; g.fillText('~/workspace', T.x + T.fs * 3.6, T.y + T.fs * .55); g.globalAlpha = 1;
  g.font = font(T.fs); let lastX = T.x + T.fs, lastY = T.y + T.fs * 2.2, typing = false;
  LINES.forEach(([t0, txt], k) => {
    const n = clamp(Math.floor((t - t0) * 34), 0, txt.length); if (!n) return;
    const y = T.y + T.fs * 2.2 + k * T.fs * 1.6, shown = txt.slice(0, n);
    g.fillStyle = k === LINES.length - 1 ? SIGNAL : txt[0] === '>' ? '#9fb87a' : BONE; g.fillText(shown, T.x + T.fs, y);
    lastX = T.x + T.fs + g.measureText(shown).width + T.fs * .15; lastY = y; typing = n < txt.length;
  });
  if (typing || Math.floor(t * 2.2) % 2 === 0){ g.fillStyle = BONE; g.fillRect(lastX, lastY, T.fs * .55, T.fs * 1.15); }

  // 7. splash rings + droplets
  const ex = xe(), ey = surf(ex, t);
  g.lineWidth = 1.4 * dpr; g.strokeStyle = BONE;
  for (let k = 0; k < 3; k++){
    const u = t - T_SPLASH - k * .18; if (u < 0 || u > 1.4) continue;
    g.globalAlpha = (1 - u / 1.4) * .8; g.beginPath(); g.ellipse(ex, ey, s * (1 + u * 5), s * (1 + u * 5) * .28, 0, 0, Math.PI * 2); g.stroke();
  }
  const u = t - T_SPLASH;
  if (u > 0 && u < .9) for (let k = 0; k < 14; k++){
    const a = -Math.PI * (.12 + .76 * hash(k, 9)), v = s * (6 + 8 * hash(k, 4));
    g.globalAlpha = 1 - u / .9; g.fillStyle = k % 3 ? BONE : SIGNAL;
    g.fillRect(ex + Math.cos(a) * v * u, ey + Math.sin(a) * v * u + 14 * s * u * u, s * .13, s * .13);
  }
  g.globalAlpha = 1;

  // 8. diver: backflip drawn as chronophotography
  if (t > T_JUMP && t < T_SPLASH){
    g.lineWidth = 1.6 * dpr; g.strokeStyle = SIGNAL;
    for (let k = 9; k >= 1; k--){
      const tt = t - k * .075; if (tt < T_JUMP) continue;
      const p = diverAt(tt); g.globalAlpha = (1 - k / 10) * .75; g.beginPath(); sq(p.x, p.y, p.a, size); g.stroke();
    }
    const p = diverAt(t); g.globalAlpha = 1; g.fillStyle = SIGNAL; g.beginPath(); sq(p.x, p.y, p.a, size); g.fill();
  } else if (t >= T_SPLASH && t < T_SPLASH + 1.2){
    const k = (t - T_SPLASH) / 1.2; g.globalAlpha = 1 - k; g.fillStyle = SIGNAL; g.beginPath(); sq(ex, ey + k * s * 3.5, -Math.PI * 3 - k * 2, size * (1 - k * .4)); g.fill(); g.globalAlpha = 1;
  }

  // 9. prone pump foil rider crossing the swell
  if (t > 6.7){
    const S2 = s * 1.55;
    const k = sm(6.7, 10, t), x = lerp(W * .31, W * .9, k), yS = surf(x, t), th = Math.atan2(surf(x + 8, t) - surf(x - 8, t), 16);
    const tx = Math.cos(th), ty = Math.sin(th), nx = -ty, ny = tx, lift = S2 * 1.0 + Math.sin(t * 8) * S2 * .12;
    const bx = x + ny * 0 + ty * lift, by = yS - tx * lift;         // board centre, lifted along the surface normal
    const line = (ax, ay, bx2, by2, w1, c1, w2, c2) => { g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx2, by2); g.lineWidth = w1; g.strokeStyle = c1; g.stroke(); g.lineWidth = w2; g.strokeStyle = c2; g.stroke(); };
    const mx = bx - ty * (lift + S2 * .55), my = by + tx * (lift + S2 * .55);
    for (let w = 1; w <= 6; w++){ const wx = x - w * S2 * .7, wy = surf(wx, t); g.globalAlpha = 1 - w / 7; line(wx - S2 * .2, wy, wx + S2 * .2, wy, 3 * dpr, INK, 1.2 * dpr, BONE); }
    g.globalAlpha = 1; g.lineCap = 'butt';
    line(bx, by, mx, my, 4 * dpr, INK, 1.6 * dpr, BONE);                                        // mast
    line(mx - tx * S2 * .5, my - ty * S2 * .5, mx + tx * S2 * .5, my + ty * S2 * .5, 4.5 * dpr, INK, 2 * dpr, BONE);   // front wing
    line(bx - tx * S2 * .8, by - ty * S2 * .8, bx + tx * S2 * .8, by + ty * S2 * .8, 7 * dpr, INK, 4 * dpr, BONE);     // board
    line(bx - tx * S2 * .45, by - ty * S2 * .45 - S2 * .16, bx + tx * S2 * .3, by + ty * S2 * .3 - S2 * .16, 5 * dpr, SIGNAL, 5 * dpr, SIGNAL); // prone rider
  }

  // 10. HUD
  const label = t < T_JUMP - .2 ? 'SYS.01 / STRUCTURE' : t < 6.8 ? 'SYS.02 / FLOW' : 'SYS.03 / MERGE', fs = Math.max(13 * dpr, s * .5);
  g.textBaseline = 'top'; g.font = font(fs, 700); g.fillStyle = INK; g.fillText(label, 14 * dpr, 14 * dpr);
  g.fillRect(14 * dpr, 14 * dpr + fs * 1.3, g.measureText(label).width, 2 * dpr);
  g.font = font(fs * .85); g.fillStyle = BONE; g.textBaseline = 'bottom';
  g.fillText('T+' + t.toFixed(2).padStart(5, '0') + ' / ' + DUR.toFixed(2), 14 * dpr, H - 14 * dpr);
  g.globalAlpha = .25; g.fillRect(0, H - 4 * dpr, W, 4 * dpr); g.globalAlpha = 1; g.fillStyle = SIGNAL; g.fillRect(0, H - 4 * dpr, W * t / DUR, 4 * dpr);
  if (t >= DUR){
    const msg = ' ↻ REPLAY  [CLICK / SPACE] ', mw = g.measureText(msg).width + 16 * dpr, bx = (W - mw) / 2, by = H - 34 * dpr;
    g.fillStyle = SIGNAL; g.fillRect(bx, by - fs * 1.5, mw, fs * 1.6); g.fillStyle = INK; g.textBaseline = 'middle'; g.fillText(msg, bx + 8 * dpr, by - fs * .7);
  }
}

// ---------- timing: exactly DUR seconds from the first frame, then hold ----------
let t0 = null, raf = 0;
function frame(now){
  if (t0 === null) t0 = now;
  clock = Math.min((now - t0) / 1000, DUR); draw(clock);
  if (clock < DUR) raf = requestAnimationFrame(frame);
}
function play(){ cancelAnimationFrame(raf); t0 = null; raf = requestAnimationFrame(frame); }
cv.addEventListener('click', () => { if (clock >= DUR) play(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); play(); } });
addEventListener('resize', resize);

resize();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const start = () => { if (reduce){ clock = DUR; draw(DUR); } else play(); };
Promise.race([document.fonts.load(font(16, 700)), new Promise(r => setTimeout(r, 1500))]).then(() => { sprites = {}; start(); });
</script>
</body>
</html>
