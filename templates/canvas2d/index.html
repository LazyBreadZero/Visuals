<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas starter</title>
<style>
  :root{--bg:#0b0c10}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
// Seeded RNG so a piece is reproducible: add ?seed=123 to the URL.
const seed = +(new URLSearchParams(location.search).get('seed') || 1);
let s = seed >>> 0;
const rand = () => ((s = (s + 0x6D2B79F5) | 0), ((t = Math.imul(s ^ (s >>> 15), 1 | s)), (((t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t) ^ (t >>> 14)) >>> 0) / 4294967296));
let t;

const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, dpr;
function resize(){ dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
addEventListener('resize', resize); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms){
  const time = reduce ? 0 : ms / 1000;
  g.fillStyle = '#0b0c10'; g.fillRect(0, 0, W, H);
  // --- draw here ---
  g.fillStyle = `hsl(${(time * 30) % 360} 80% 60%)`;
  g.beginPath(); g.arc(W/2 + Math.cos(time) * W/6, H/2 + Math.sin(time) * H/6, 40 * dpr, 0, Math.PI * 2); g.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
