<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>p5 starter</title>
<style>html,body{margin:0;background:#0b0c10;overflow:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head><body>
<script>
// Reproducible: ?seed=42
const SEED = +(new URLSearchParams(location.search).get('seed') || 1);
function setup(){ createCanvas(windowWidth, windowHeight); randomSeed(SEED); noiseSeed(SEED); colorMode(HSB, 360, 100, 100, 1); background(230, 30, 6); }
function draw(){
  // Flow-field walkers: replace with your own idea.
  noStroke();
  for (let i = 0; i < 60; i++){
    const x = random(width), y = random(height);
    const a = noise(x * .004, y * .004, frameCount * .002) * TWO_PI * 2;
    fill((a * 30) % 360, 70, 95, .35);
    circle(x + cos(a) * 6, y + sin(a) * 6, 2);
  }
}
function windowResized(){ resizeCanvas(windowWidth, windowHeight); background(230, 30, 6); }
</script></body></html>
