<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js starter</title>
<style>html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden}canvas{display:block}</style>
<!-- Pin the version. Unpinned Three.js is the #1 cause of "it worked yesterday" breakage. -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3, 2, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202030, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(4, 6, 3); scene.add(key);

const mesh = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.35, 200, 32),
  new THREE.MeshStandardMaterial({ color: 0x6aa9ff, roughness: 0.25, metalness: 0.6 }));
scene.add(mesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop((ms) => { mesh.rotation.y = ms / 4000; controls.update(); renderer.render(scene, camera); });
</script></body></html>
